[package]
name = "dsh-novel"
version = "1.0.5"
description = "DSH-Novel —— 基于 DeepSeek Harness 的小说写作工作台（原版 WebUI + 文件面板）"
authors = ["KurohaneKaoruko"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
