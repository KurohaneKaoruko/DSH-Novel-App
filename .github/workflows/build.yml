name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify-kernel:
    name: 内核 ACP 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装工具依赖并生成智能体
        run: |
          npm install js-yaml --no-audit --no-fund --cache .npm-cache
          node scripts/generate-agents.mjs
      - name: 安装内核
        run: node scripts/kernel-install.mjs
      - name: ACP 交互式冒烟测试（stock acp profile）
        run: |
          chmod +x kernel/node_modules/node-pty/prebuilds/linux-x64/spawn-helper || true
          node scripts/verify-acp-live.mjs --home .testhome --profile acp
      - name: ACP 交互式冒烟测试（novel profile + 预设）
        run: node scripts/verify-acp-live.mjs --home .testhome --profile novel 2>&1 | tee verify-acp.log

  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: win
            arch: x64
            variant: full
          - name: macos-arm64
            os: macos-latest
            platform: mac
            arch: arm64
            variant: full
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            variant: full
          - name: windows-x64-online
            os: windows-latest
            platform: win
            arch: x64
            variant: online
          - name: macos-arm64-online
            os: macos-latest
            platform: mac
            arch: arm64
            variant: online
          - name: linux-x64-online
            os: ubuntu-latest
            platform: linux
            arch: x64
            variant: online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux 依赖（Tauri）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file             libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: 安装工具依赖并生成智能体
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2 3; do
            npm install js-yaml --no-audit --no-fund --cache .npm-cache 2>&1 | tee npm-install.log && break
            echo "npm install 重试 $i/3 …"; sleep 8
          done
          node scripts/generate-agents.mjs 2>&1 | tee agents-gen.log
      - name: 安装内核
        run: node scripts/kernel-install.mjs
      - name: 构建打包（Tauri）
        run: node scripts/build.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --online ${{ matrix.variant == 'online' && '--online' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSH-Novel-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/checksums.txt
            dist/build-failure.txt
            npm-install.log
            agents-gen.log
          retention-days: 14
          if-no-files-found: ignore

      - name: 失败诊断写入 Summary 与注解
        if: failure()
        shell: bash
        run: |
          echo "## Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dist/build-failure.txt 2>/dev/null | tail -c 6000 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f dist/build-failure.txt ]; then
            grep -aiE 'error\[|error:|--> |failed|thrown' dist/build-failure.txt | tail -n 30 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
          fi

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: 生成校验和
        run: |
          cd dist && sha256sum * > checksums.txt || true
      - uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/checksums.txt
          generate_release_notes: true
