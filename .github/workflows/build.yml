name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Generate agents
        run: node scripts/generate-agents.mjs
      - name: Install kernel
        run: node scripts/kernel-install.mjs
      - name: Build
        run: node scripts/build.mjs
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Novel-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/checksums.txt
            dist/build-failure.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f dist/build-failure.txt ]; then
            grep -aiE 'error\[|error:|--> |failed|thrown' dist/build-failure.txt | tail -n 30 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
          fi

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist && sha256sum * > checksums.txt || true
      - name: Clean stale assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset "$GITHUB_REF_NAME" "$a" -y || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/checksums.txt
          generate_release_notes: true
